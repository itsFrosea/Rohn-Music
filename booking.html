<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking | Rohn Music</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <nav class="navigation">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About Me
            </a>

            <a href="shows.html">
                Shows
            </a>

            <a
                href="booking.html"
                class="active"
            >
                Booking
            </a>

        </nav>


        <div class="logo">
            ROHN MUSIC
        </div>


        <div class="header-right">

            <div class="socials">

                <a
                    href="#"
                    aria-label="Instagram"
                >
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a
                    href="#"
                    aria-label="YouTube"
                >
                    <i class="fa-brands fa-youtube"></i>
                </a>

            </div>


            <div class="account-links">

                <a href="login/login.html">
                    LOGIN
                </a>

                <a
                    href="login/register.html"
                    class="register-link"
                >
                    REGISTER
                </a>

            </div>

        </div>

    </header>


    <!-- BOOKING PAGE -->

    <!-- ========================================
     BOOKING PAGE
========================================= -->

<main class="booking-page">

        <!-- BOOKING BACKGROUND IMAGE -->
        

        <!-- ========================================
            BOOKING INTRO
        ========================================= -->

        <section class="booking-hero">

            <div class="booking-hero-content">

                <p class="booking-label">
                    BOOKING
                </p>

                <h1>
                    BRING ROHN MUSIC<br>
                    TO YOUR EVENT.
                </h1>

                <p class="booking-description">
                    Fill out the form below with the details
                    of your event and we'll get back to you.
                </p>

            </div>

        </section>



        <!-- ========================================
            BOOKING FORM
        ========================================= -->

        <section
            class="booking-section page-transition-text"
        >

            <form
                class="booking-form"
                id="bookingForm"
            >


                <!-- ========================================
                    PERSONAL DETAILS
                ========================================= -->

                <div class="form-section">

                    <h2>
                        YOUR DETAILS
                    </h2>


                    <div class="form-grid">


                        <!-- NAME -->

                        <div class="form-group">

                            <label for="name">
                                Full Name
                            </label>


                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Your name"
                                required
                            >

                        </div>



                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>


                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="you@example.com"
                                required
                            >

                        </div>



                        <!-- PHONE -->

                        <div class="form-group">

                            <label for="phone">
                                Phone
                            </label>


                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="+91"
                            >

                        </div>

                    </div>

                </div>



                <!-- ========================================
                    EVENT DETAILS
                ========================================= -->

                <div class="form-section">

                    <h2>
                        EVENT DETAILS
                    </h2>


                    <div class="form-grid">


                        <!-- EVENT TYPE -->

                        <div class="form-group">

                            <label for="event-type">
                                Event Type
                            </label>


                            <select
                                id="event-type"
                                name="event_type"
                                required
                            >

                                <option value="">
                                    Select event type
                                </option>


                                <option value="club">
                                    Club / Nightlife
                                </option>


                                <option value="festival">
                                    Festival
                                </option>


                                <option value="wedding">
                                    Wedding
                                </option>


                                <option value="private">
                                    Private Event
                                </option>


                                <option value="corporate">
                                    Corporate Event
                                </option>


                                <option value="other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <!-- EVENT DATE -->

                        <div class="form-group">

                            <label for="event-date">
                                Event Date
                            </label>


                            <input
                                type="date"
                                id="event-date"
                                name="event_date"
                                required
                            >

                        </div>



                        <!-- VENUE -->

                        <div class="form-group">

                            <label for="venue">
                                Venue
                            </label>


                            <input
                                type="text"
                                id="venue"
                                name="venue"
                                placeholder="Venue name"
                            >

                        </div>



                        <!-- CITY -->

                        <div class="form-group">

                            <label for="city">
                                City
                            </label>


                            <input
                                type="text"
                                id="city"
                                name="city"
                                placeholder="City"
                            >

                        </div>

                    </div>

                </div>



                <!-- ========================================
                    MESSAGE
                ========================================= -->

                <div class="form-section">

                    <h2>
                        MORE ABOUT THE EVENT
                    </h2>


                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>


                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Tell us a little about your event..."
                        ></textarea>

                    </div>

                </div>



                <!-- ========================================
                    SUBMIT
                ========================================= -->

                <div class="form-submit">

                    <button
                        type="submit"
                        class="booking-button"
                        id="bookingSubmit"
                    >
                        SEND BOOKING REQUEST
                    </button>


                    <p
                        id="bookingMessage"
                        class="booking-message"
                    ></p>

                </div>


            </form>

        </section>

    </main>
    <script src="booking.js"></script>
    <script src="account.js"></script>
</body>

</html>
