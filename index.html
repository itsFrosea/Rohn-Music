<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rohn Music | DJ & Producer</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="header">


        <!-- NAVIGATION -->

        <nav class="navigation">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About Me
            </a>

            <a href="shows.html">
                Shows
            </a>

            <a href="booking.html">
                Booking
            </a>

        </nav>


        <!-- LOGO -->

        <div class="logo">
            ROHN MUSIC
        </div>


        <!-- HEADER RIGHT -->

        <div class="header-right">


            <!-- SOCIALS -->

            <div class="socials">

                <a
                    href="#"
                    aria-label="Instagram"
                >
                    <i class="fa-brands fa-instagram"></i>
                </a>


                <a
                    href="#"
                    aria-label="YouTube"
                >
                    <i class="fa-brands fa-youtube"></i>
                </a>

            </div>


            <!-- ACCOUNT -->

            <div class="account-links">

                <a href="login/login.html">
                    LOGIN
                </a>


                <a
                    href="login/register.html"
                    class="register-link"
                >
                    REGISTER
                </a>

            </div>

        </div>

    </header>



    <!-- ========================================
         PAGE CONTAINER
         
         IMPORTANT:
         This is the only part that changes
         during navigation.
    ========================================= -->

    <main id="page-container">


        <!-- ====================================
             HOME HERO
        ====================================== -->

        <section
            class="hero"
            id="home"
        >


            <div class="hero-content">


                <!-- LABEL -->

                <p class="hero-label reveal-item">
                        DJ & PRODUCER
                    </p>

                    <h1 class="hero-title">
                        <span class="reveal-item">CREATING</span>
                        <span class="reveal-item">SOUND.</span>
                        <span class="reveal-item">CREATING</span>
                        <span class="reveal-item">MOMENTS.</span>
                    </h1>

                    <p class="hero-description reveal-item">
                        Live performances and original sound
                        for unforgettable events.
                    </p>


                <!-- BUTTONS -->

                <div class="hero-buttons">


                    <a
                        href="booking.html"
                        class="btn btn-primary"
                    >
                        BOOK FOR YOUR EVENT
                    </a>


                    <a
                        href="shows.html"
                        class="btn btn-secondary"
                    >
                        UPCOMING SHOWS
                    </a>

                </div>


                <!-- NEXT SHOW -->

                <div class="next-show">


                    <span class="next-show-label">
                        NEXT SHOW
                    </span>


                    <span class="next-show-info">
                        28 AUGUST · MUMBAI
                    </span>

                </div>


            </div>


        </section>


    </main>



    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="account.js"></script>

    <script src="transition.js"></script>


</body>

</html>
