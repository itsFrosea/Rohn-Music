<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Rohn Music</title>

    <link
        rel="stylesheet"
        href="admin-login.css"
    >

</head>

<body>

    <main class="admin-login-page">

        <div class="admin-login-box">

            <p class="admin-login-label">
                ROHN MUSIC
            </p>

            <h1>
                ADMIN ACCESS
            </h1>

            <form id="adminLoginForm">

                <label>
                    EMAIL
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    required
                    autocomplete="username"
                >


                <label>
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    required
                    autocomplete="current-password"
                >


                <button
                    type="submit"
                >
                    SIGN IN
                </button>


                <p
                    id="adminLoginMessage"
                    class="admin-login-message"
                ></p>

            </form>

        </div>

    </main>


    <script src="admin-login.js"></script>

</body>

</html>
