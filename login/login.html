<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Rohn Music</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <p class="auth-label">
                ROHN MUSIC
            </p>

            <h1>
                WELCOME BACK
            </h1>

            <p class="auth-description">
                Log in to manage your bookings.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="password"
                        required
                    >

                </div>


                <p
                    id="loginMessage"
                    class="auth-message"
                ></p>


                <button
                    type="submit"
                    class="booking-button"
                >
                    LOG IN
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>

        </div>

    </main>


    <script src="auth.js"></script>

</body>

</html>
